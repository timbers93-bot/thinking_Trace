<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사고 흔적(Thinking Trace) - AI 연동 교육 활동 플랫폼</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-gradient">

  <!-- Header Navigation -->
  <header id="main-header" class="header">
    <div class="header-container">
      <div class="brand" onclick="window.location.hash='#login'">
        <div class="brand-logo">
          <i class="fa-solid fa-brain-circuit"></i>
        </div>
        <div class="brand-text">
          <span class="brand-name">Thinking Trace</span>
          <span class="brand-sub">사고 흔적 플랫폼</span>
        </div>
      </div>

      <!-- Navigation & User Profile -->
      <div id="user-nav" class="user-nav">
        <!-- Dynamic User Status / Logout will render here -->
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app" class="main-content">
    <!-- Dynamic View (Login / Student Activity / Teacher Dashboard) will render here -->
  </main>

  <!-- Global Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p>© 2026 Thinking Trace Edu. AI 기반 학생 사고력 확장 프로젝트</p>
      <div class="footer-links">
        <button id="btn-open-settings" class="btn-text-sm">
          <i class="fa-solid fa-gear"></i> Apps Script 백엔드 설정
        </button>
      </div>
    </div>
  </footer>

  <!-- Apps Script Settings Modal -->
  <div id="settings-modal" class="modal-backdrop hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fa-solid fa-plug-circle-bolt"></i> Apps Script 백엔드 URL 설정</h3>
        <button id="btn-close-settings" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p class="text-desc">
          구글 시트 연동 Apps Script Web App URL을 설정하세요. 설정하지 않을 경우 <strong>테스트용 Mock API Mode</strong>로 동작합니다.
        </p>
        <div class="form-group">
          <label for="apps-script-url">Web App URL (https://script.google.com/macros/s/.../exec)</label>
          <input type="url" id="apps-script-url" placeholder="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec" />
        </div>
        <div class="api-status-info">
          <span id="api-mode-badge" class="badge badge-mock">
            <i class="fa-solid fa-vial"></i> Mock API Mode (오프라인/테스트)
          </span>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-save-settings" class="btn btn-primary">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JavaScript App Modules -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
